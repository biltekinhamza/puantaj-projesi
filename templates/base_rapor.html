<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Rapor{% endblock %}</title>
<style>
/* Zebra satır */
.personel-table tbody tr:nth-child(even) {
    background-color: #f9fafb;
}

/* Hover efekti */
.personel-table tbody tr:hover {
    background-color: #eef4ff;
}

/* Aktif / pasif (ileride kullanılır) */
.personel-table tr.aktif {
    border-left: 4px solid #16a34a;
}

.personel-table tr.pasif {
    border-left: 4px solid #dc2626;
    opacity: 0.75;
}

/* Aylık maaş ortalama */
.personel-table td.maas {
    text-align: center;
    font-weight: 600;
}
</style>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6f8;
            font-size: 14px;
        }

        .rapor-container {
            width: 100%;
            padding: 20px 30px;
        }

        table {
            background: #fff;
        }

        th {
            background: #2c2f33;
            color: #fff;
            white-space: nowrap;
        }

        td {
            white-space: nowrap;
        }
    </style>
</head>
<body>

{% if show_navbar %}
<nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <span class="navbar-brand">{{ sirket.kisa_ad }} - Rapor</span>
    </div>
</nav>
{% endif %}

<div class="rapor-container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
